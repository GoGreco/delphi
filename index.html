<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Delphi</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <header>
            <h1 class="titulo_principal">Bem Vindo ao Delphi</h1>
            <h4 class="subtitulo">Pergunte e será respondido:</h4>
        </header>
        <section class="corpo">
            <input type="text" class="input" placeholder="Diga sua questão....">
            <button class="btn">Perguntar</button>
        </section>
        <section class="resposta">
            <p class="resposta-texto"></p>
            <button class="btn btn-favoritar" hidden>Favoritar</button>
        </section>
        <section class="favoritos">
            <h2>Meus favoritos</h2>
            <p class="favoritos-status"></p>
            <ul class="lista-favoritos"></ul>
        </section>
        <script type="module" src="main.js"></script>
    </body>
</html>
